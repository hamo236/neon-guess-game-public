<style>
        body {
            background-color: #111415;
            color: #e1e3e4;
            overscroll-behavior: none;
        }
        
        .bg-cyber-grid {
            background-size: 20px 20px;
            background-position: center center;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .neon-border {
            box-shadow: inset 0 0 0 1px rgba(125, 244, 255, 0.5), 0 0 10px rgba(125, 244, 255, 0.2);
        }
        
        .neon-text-glow {
            text-shadow: 0 0 8px rgba(125, 244, 255, 0.6);
        }

        /* Pulse animation for timer */
        @keyframes pulse-neon {
            0%, 100% { opacity: 1; text-shadow: 0 0 8px rgba(125, 244, 255, 0.8); }
            50% { opacity: 0.7; text-shadow: 0 0 4px rgba(125, 244, 255, 0.4); }
        }
        
        .animate-pulse-neon {
            animation: pulse-neon 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        /* Hide scrollbar for chat */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
